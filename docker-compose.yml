# Local infrastructure for development: `make infra` starts both services.
# Flask, the worker and Vite run on your machine (see README).
# Values come from the root .env.
name: ca-helper

services:
  # PostgreSQL 16 (the pgvector image, ready for the assistant's embeddings later).
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lets `make infra` (docker compose up --wait) block until Postgres accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local SMTP server that catches every email. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  pgdata:
