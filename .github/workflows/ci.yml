# Continuous integration: runs on every pull request and on pushes to main.
#
#   backend   pytest (with Postgres), then checks that the OpenAPI spec builds
#   frontend  tests, build
#
# CI installs the same backend/requirements.txt and Node 22 as the Docker images.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ca_helper
          POSTGRES_PASSWORD: ca_helper_ci
          POSTGRES_DB: ca_helper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ca_helper -d ca_helper"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ca_helper:ca_helper_ci@localhost:5432/ca_helper
      TEST_DATABASE_URL: postgresql+psycopg://ca_helper:ca_helper_ci@localhost:5432/ca_helper_test
      SECRET_KEY: ci-only-secret-key
      JWT_SECRET_KEY: ci-only-jwt-secret-key-long-enough
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      # The OCR program (app/ocr.py), as in the backend Docker image.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Backend tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test
      - run: npm run build

