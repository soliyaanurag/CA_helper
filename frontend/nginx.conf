# nginx config for the frontend container (full-Docker mode).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow document uploads through the proxy.
    client_max_body_size 20m;

    # API calls go to the Flask backend container (gunicorn on port 8000).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths return index.html so React Router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
