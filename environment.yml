# Shared conda environment for CA Helper. Every member uses exactly this file.
#
# Rules (see CLAUDE.md → "Conda rules"):
#   - conda installs ONLY python, nodejs, pip and tesseract (from conda-forge);
#     tesseract is the OCR program, not a Python library.
#   - ALL Python packages come from pip via backend/requirements*.txt,
#     the same files CI uses.
#   - nodejs (with npm) runs the frontend tooling; every npm command runs through
#     `conda run -n ca-helper` (the Makefile does this). Frontend packages still
#     come from frontend/package-lock.json.
#
# Create:  conda env create -f environment.yml          (make setup does this)
# Update:  conda env update -n ca-helper -f environment.yml --prune   (make env-update)
name: ca-helper
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - nodejs=22
  # The Tesseract OCR program (app/utils/ocr.py reads photos and scans with it, locally).
  - tesseract=5
  - pip
  - pip:
      - -r backend/requirements-dev.txt
