# Git hooks that run on every `git commit`. Installed by `make setup`.
# Run on all files manually:  conda run -n ca-helper pre-commit run --all-files
#
# The local hooks run from the shared conda env (`conda run`): ruff at the version
# pinned in backend/requirements-dev.txt, ESLint/Prettier with the env's Node 22.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (Python)
        entry: conda run -n ca-helper ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format (Python)
        entry: conda run -n ca-helper ruff format
        language: system
        types: [python]
      - id: frontend-eslint
        name: eslint (frontend)
        entry: conda run -n ca-helper --cwd frontend npx --no-install eslint --max-warnings=0 .
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-prettier
        name: prettier (frontend)
        entry: conda run -n ca-helper --cwd frontend npx --no-install prettier --check .
        language: system
        files: ^frontend/
        pass_filenames: false
